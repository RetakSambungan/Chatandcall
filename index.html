<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Chat & Call</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
}

header {
  height: 58px;
  background: #0084ff;
  color: white;
  display: flex;
  align-items: center;
  padding: 0 15px;
  font-size: 20px;
  font-weight: bold;
}

#status {
  margin-left: auto;
  font-size: 12px;
  font-weight: normal;
}

#chat {
  height: calc(100vh - 120px);
  overflow-y: auto;
  padding: 12px;
}

.message {
  max-width: 80%;
  padding: 10px 13px;
  margin: 7px 0;
  border-radius: 15px;
  word-wrap: break-word;
}

.me {
  background: #0084ff;
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

.other {
  background: white;
  margin-right: auto;
  border-bottom-left-radius: 4px;
}

.system {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin: 10px;
}

#inputArea {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 62px;
  background: white;
  display: flex;
  align-items: center;
  padding: 7px;
  gap: 6px;
  border-top: 1px solid #ddd;
}

#messageInput {
  flex: 1;
  height: 46px;
  border: 1px solid #ddd;
  border-radius: 23px;
  padding: 0 15px;
  font-size: 16px;
  outline: none;
}

.iconButton {
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: #eee;
  font-size: 21px;
  cursor: pointer;
}

.sendButton {
  background: #0084ff;
  color: white;
}

.callButton {
  background: transparent;
  color: white;
  font-size: 23px;
  border: none;
  margin-left: 5px;
}

#fileInput {
  display: none;
}

/* VIDEO */

#videoScreen {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 1000;
}

#remoteVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #111;
}

#localVideo {
  position: absolute;
  right: 12px;
  top: 12px;
  width: 120px;
  height: 170px;
  object-fit: cover;
  background: #222;
  border-radius: 10px;
  border: 2px solid white;
}

.callControls {
  position: absolute;
  bottom: 30px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 20px;
}

.callControl {
  width: 58px;
  height: 58px;
  border: none;
  border-radius: 50%;
  font-size: 25px;
  color: white;
  background: #333;
}

.endCall {
  background: #e53935;
}

/* INCOMING CALL */

#incomingCall {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(0,0,0,.85);
  color: white;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.callerIcon {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #0084ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  margin-bottom: 20px;
}

#callerName {
  font-size: 25px;
  margin-bottom: 8px;
}

#callType {
  color: #ccc;
  margin-bottom: 35px;
}

.incomingButtons {
  display: flex;
  gap: 40px;
}

.incomingButton {
  width: 65px;
  height: 65px;
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 28px;
}

.accept {
  background: #22c55e;
}

.reject {
  background: #ef4444;
}

/* IMAGE */

.chatImage {
  max-width: 220px;
  border-radius: 10px;
  display: block;
}
</style>
</head>

<body>

<header>
  Chat & Call

  <button class="callButton" onclick="startCall(true)">
    📹
  </button>

  <button class="callButton" onclick="startCall(false)">
    📞
  </button>

  <span id="status">Menghubungkan...</span>
</header>

<div id="chat">
  <div class="system">
    Selamat datang. Tunggu sampai pengguna lain terhubung.
  </div>
</div>

<div id="inputArea">

  <button class="iconButton"
    onclick="document.getElementById('fileInput').click()">
    🖼️
  </button>

  <input
    id="fileInput"
    type="file"
    accept="image/*"
    onchange="sendImage(event)"
  >

  <input
    id="messageInput"
    type="text"
    placeholder="Tulis pesan..."
    autocomplete="off"
  >

  <button
    class="iconButton sendButton"
    onclick="sendMessage()">
    ➤
  </button>

</div>

<!-- VIDEO CALL -->

<div id="videoScreen">

  <video
    id="remoteVideo"
    autoplay
    playsinline>
  </video>

  <video
    id="localVideo"
    autoplay
    muted
    playsinline>
  </video>

  <div class="callControls">

    <button
      class="callControl"
      onclick="toggleMute()">
      🎤
    </button>

    <button
      class="callControl"
      onclick="toggleCamera()">
      📷
    </button>

    <button
      class="callControl endCall"
      onclick="endCall()">
      ☎
    </button>

  </div>

</div>

<!-- PANGGILAN MASUK -->

<div id="incomingCall">

  <div class="callerIcon">
    👤
  </div>

  <div id="callerName">
    Panggilan masuk
  </div>

  <div id="callType">
    Video call
  </div>

  <div class="incomingButtons">

    <button
      class="incomingButton reject"
      onclick="rejectCall()">
      ✕
    </button>

    <button
      class="incomingButton accept"
      onclick="acceptCall()">
      ✓
    </button>

  </div>

</div>

<script>
/* =========================
   WEBSOCKET
========================= */

const protocol =
  location.protocol === "https:" ? "wss://" : "ws://";

const socket =
  new WebSocket(protocol + location.host);

let connected = false;

socket.onopen = () => {
  connected = true;

  document.getElementById("status").textContent =
    "Online";

  addSystem("Terhubung ke server");
};

socket.onclose = () => {
  connected = false;

  document.getElementById("status").textContent =
    "Offline";

  addSystem("Koneksi server terputus");
};

socket.onerror = () => {
  document.getElementById("status").textContent =
    "Error";
};


/* =========================
   CHAT
========================= */

function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if (!text || !connected) return;

  socket.send(JSON.stringify({
    type: "chat",
    text: text
  }));

  addMessage(text, true);

  input.value = "";
}

document
  .getElementById("messageInput")
  .addEventListener("keydown", e => {

    if (e.key === "Enter") {
      sendMessage();
    }

  });


function addMessage(text, mine) {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "message " + (mine ? "me" : "other");

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}


function addSystem(text) {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className = "system";

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}


/* =========================
   IMAGE
========================= */

function sendImage(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  const reader =
    new FileReader();

  reader.onload = () => {

    const imageData =
      reader.result;

    /*
      Untuk versi awal ini gambar dikirim
      sebagai data melalui WebSocket.
    */

    socket.send(JSON.stringify({
      type: "image",
      data: imageData
    }));

    addImage(imageData, true);
  };

  reader.readAsDataURL(file);

  event.target.value = "";
}


function addImage(data, mine) {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "message " + (mine ? "me" : "other");

  const img =
    document.createElement("img");

  img.src = data;
  img.className = "chatImage";

  div.appendChild(img);

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}


/* =========================
   WEBRTC
========================= */

let peerConnection = null;
let localStream = null;

let isCaller = false;
let pendingOffer = null;
let pendingCallType = "video";

const rtcConfig = {

  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    },
    {
      urls: "stun:stun1.l.google.com:19302"
    }
  ]

};


/* =========================
   MEDIA
========================= */

async function getMedia(video) {

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({
        video: video,
        audio: true
      });

    document
      .getElementById("localVideo")
      .srcObject = localStream;

    return true;

  } catch (error) {

    alert(
      "Tidak bisa menggunakan kamera/mikrofon: " +
      error.message
    );

    return false;
  }
}


/* =========================
   START CALL
========================= */

async function startCall(video) {

  if (!connected) {

    alert("Belum terhubung ke server");

    return;
  }

  const ok =
    await getMedia(video);

  if (!ok) return;

  isCaller = true;

  pendingCallType =
    video ? "video" : "audio";

  showVideoScreen(video);

  createPeer();

  const offer =
    await peerConnection.createOffer();

  await peerConnection.setLocalDescription(
    offer
  );

  socket.send(JSON.stringify({
    type: "call",
    callType: pendingCallType
  }));

  socket.send(JSON.stringify({
    type: "offer",
    offer: offer
  }));
}


/* =========================
   PEER
========================= */

function createPeer() {

  peerConnection =
    new RTCPeerConnection(rtcConfig);

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });
  }

  peerConnection.ontrack = event => {

    const remoteVideo =
      document.getElementById("remoteVideo");

    if (event.streams &&
        event.streams[0]) {

      remoteVideo.srcObject =
        event.streams[0];

    }

  };

  peerConnection.onicecandidate =
    event => {

      if (event.candidate) {

        socket.send(JSON.stringify({
          type: "candidate",
          candidate: event.candidate
        }));

      }

    };

  peerConnection.onconnectionstatechange =
    () => {

      const state =
        peerConnection.connectionState;

      if (state === "connected") {

        addSystem(
          "Panggilan tersambung"
        );

      }

      if (
        state === "failed" ||
        state === "disconnected" ||
        state === "closed"
      ) {

        endCall(false);

      }

    };
}


/* =========================
   INCOMING CALL
========================= */

function showIncomingCall(type) {

  pendingCallType = type;

  document.getElementById(
    "callType"
  ).textContent =
    type === "video"
      ? "Panggilan video masuk"
      : "Panggilan suara masuk";

  document.getElementById(
    "incomingCall"
  ).style.display = "flex";
}


/* =========================
   ACCEPT
========================= */

async function acceptCall() {

  document.getElementById(
    "incomingCall"
  ).style.display = "none";

  const video =
    pendingCallType === "video";

  const ok =
    await getMedia(video);

  if (!ok) {

    rejectCall();

    return;
  }

  isCaller = false;

  showVideoScreen(video);

  createPeer();

  if (pendingOffer) {

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(
        pendingOffer
      )
    );

    const answer =
      await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(
      answer
    );

    socket.send(JSON.stringify({
      type: "answer",
      answer: answer
    }));

    pendingOffer = null;
  }
}


/* =========================
   REJECT
========================= */

function rejectCall() {

  document.getElementById(
    "incomingCall"
  ).style.display = "none";

  socket.send(JSON.stringify({
    type: "reject"
  }));

  pendingOffer = null;
}


/* =========================
   END CALL
========================= */

function endCall(sendSignal = true) {

  if (sendSignal && connected) {

    socket.send(JSON.stringify({
      type: "hangup"
    }));

  }

  if (peerConnection) {

    peerConnection.close();
    peerConnection = null;

  }

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => track.stop());

    localStream = null;

  }

  document.getElementById(
    "localVideo"
  ).srcObject = null;

  document.getElementById(
    "remoteVideo"
  ).srcObject = null;

  document.getElementById(
    "videoScreen"
  ).style.display = "none";

  addSystem("Panggilan selesai");
}


/* =========================
   VIDEO SCREEN
========================= */

function showVideoScreen(video) {

  document.getElementById(
    "videoScreen"
  ).style.display = "block";

  const local =
    document.getElementById("localVideo");

  local.style.display =
    video ? "block" : "none";

}


/* =========================
   MUTE
========================= */

function toggleMute() {

  if (!localStream) return;

  localStream
    .getAudioTracks()
    .forEach(track => {

      track.enabled =
        !track.enabled;

    });

}


/* =========================
   CAMERA
========================= */

function toggleCamera() {

  if (!localStream) return;

  localStream
    .getVideoTracks()
    .forEach(track => {

      track.enabled =
        !track.enabled;

    });

}


/* =========================
   SOCKET MESSAGES
========================= */

socket.onmessage = async event => {

  let data;

  try {

    data =
      JSON.parse(event.data);

  } catch {

    return;

  }


  /* CHAT */

  if (data.type === "chat") {

    addMessage(
      data.text,
      false
    );

    return;
  }


  /* IMAGE */

  if (data.type === "image") {

    addImage(
      data.data,
      false
    );

    return;
  }


  /* CALL */

  if (data.type === "call") {

    showIncomingCall(
      data.callType
    );

    return;
  }


  /* OFFER */

  if (data.type === "offer") {

    pendingOffer =
      data.offer;

    return;
  }


  /* ANSWER */

  if (data.type === "answer") {

    if (!peerConnection) return;

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

    return;
  }


  /* ICE */

  if (data.type === "candidate") {

    try {

      if (peerConnection) {

        await peerConnection.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }

    } catch (error) {

      console.log(
        "ICE error:",
        error
      );

    }

    return;
  }


  /* REJECT */

  if (data.type === "reject") {

    addSystem(
      "Panggilan ditolak"
    );

    endCall(false);

    return;
  }


  /* HANGUP */

  if (data.type === "hangup") {

    addSystem(
      "Panggilan berakhir"
    );

    endCall(false);

    return;
  }

};
</script>

</body>
</html>
