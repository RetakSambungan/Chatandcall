<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>MasGuntoro Chat</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#111b21;
}

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
display:flex;
flex-direction:column;
}

/* HEADER */

.header{
height:62px;
min-height:62px;
background:#fff;
display:flex;
align-items:center;
padding:0 8px;
gap:10px;
border-bottom:1px solid #eee;
}

.top-ico{
width:28px;
height:28px;
object-fit:contain;
cursor:pointer;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
overflow:hidden;
background:#ddd;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.name{
flex:1;
font-weight:600;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.top-right{
display:flex;
gap:14px;
}

/* CHAT */

.chat-area{
flex:1;
background:#e5ddd5
url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:6px;
}

.msg{
max-width:78%;
padding:8px 10px;
border-radius:8px;
font-size:14px;
background:#fff;
box-shadow:0 1px 1px #0002;
word-break:break-word;
}

.me{
align-self:flex-end;
background:#d9fdd3;
}

.time{
font-size:10px;
color:#667781;
float:right;
margin:6px 0 0 8px;
}

/* INPUT */

.input-bar{
height:62px;
min-height:62px;
padding:6px 8px;
background:#f0f2f5;
display:flex;
align-items:center;
gap:6px;
}

.input-box{
flex:1;
background:#fff;
border-radius:25px;
display:flex;
align-items:center;
padding:5px 10px 5px 12px;
gap:6px;
min-width:0;
}

.input-box input{
flex:1;
width:0;
border:0;
outline:0;
font-size:15px;
padding:8px 0;
}

.ico{
width:24px;
height:24px;
object-fit:contain;
cursor:pointer;
}

.mic-foto{
width:46px;
height:46px;
min-width:46px;
border-radius:50%;
object-fit:cover;
background:#00a884;
padding:8px;
cursor:pointer;
}

/* EMOJI */

#emojiPanel{
position:absolute;
bottom:62px;
left:0;
right:0;
background:#fff;
height:200px;
overflow-y:auto;
padding:10px;
display:none;
z-index:30;
}

#emojiPanel span{
font-size:26px;
padding:6px;
display:inline-block;
cursor:pointer;
}

/* PEOPLE */

#peoplePanel{
position:fixed;
top:62px;
right:8px;
width:240px;
max-height:320px;
overflow-y:auto;
background:#fff;
border-radius:10px;
box-shadow:0 3px 15px #0005;
z-index:50;
display:none;
}

.people-title{
padding:12px;
font-weight:bold;
border-bottom:1px solid #eee;
}

.person{
display:flex;
align-items:center;
gap:10px;
padding:10px;
cursor:pointer;
}

.person:hover{
background:#f0f2f5;
}

.person img{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
}

.person-name{
flex:1;
}

/* CALL */

#callScreen{
position:fixed;
inset:0;
background:#111;
z-index:100;
display:none;
flex-direction:column;
}

#remoteVideo{
flex:1;
display:flex;
align-items:center;
justify-content:center;
background:#111;
color:#fff;
position:relative;
}

#remoteVideo video{
width:100%;
height:100%;
object-fit:cover;
}

#localVideo{
position:absolute;
right:15px;
bottom:90px;
width:110px;
height:160px;
background:#333;
border:2px solid #fff;
border-radius:12px;
overflow:hidden;
z-index:2;
}

#localVideo video{
width:100%;
height:100%;
object-fit:cover;
}

.call-controls{
height:80px;
background:#000c;
display:flex;
align-items:center;
justify-content:center;
}

.call-btn{
width:58px;
height:58px;
border:0;
border-radius:50%;
cursor:pointer;
padding:12px;
}

.call-btn img{
width:100%;
height:100%;
object-fit:contain;
}

.end-call{
background:#ff3b30;
}

/* INCOMING */

#incomingCall{
position:fixed;
inset:0;
background:#000d;
z-index:200;
display:none;
align-items:center;
justify-content:center;
}

.incoming-card{
width:85%;
max-width:320px;
background:#fff;
border-radius:18px;
padding:25px;
text-align:center;
}

.incoming-avatar{
width:80px;
height:80px;
border-radius:50%;
overflow:hidden;
margin:auto;
background:#ddd;
}

.incoming-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.incoming-name{
font-size:20px;
font-weight:bold;
margin-top:12px;
}

.incoming-type{
color:#667781;
margin-top:6px;
}

.incoming-buttons{
display:flex;
justify-content:center;
gap:35px;
margin-top:25px;
}

.incoming-btn{
width:60px;
height:60px;
border:0;
border-radius:50%;
padding:15px;
cursor:pointer;
}

.incoming-btn img{
width:100%;
height:100%;
object-fit:contain;
}

.accept{
background:#00a884;
}

.reject{
background:#ff3b30;
}

/* JOIN */

#joinModal{
position:fixed;
inset:0;
background:#000c;
z-index:300;
display:flex;
align-items:center;
justify-content:center;
}

.join-card{
background:#fff;
padding:20px;
border-radius:12px;
width:85%;
max-width:300px;
text-align:center;
}

.join-card input{
width:100%;
padding:12px;
margin:5px 0;
border:1px solid #ddd;
border-radius:8px;
}

.join-card button{
width:100%;
padding:12px;
background:#00a884;
color:#fff;
border:0;
border-radius:8px;
margin-top:10px;
font-weight:bold;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<img
class="top-ico"
id="top1"
src="https://img.icons8.com/ios-filled/50/000000/back.png"
alt="Kembali"
>

<div class="avatar">

<img
src="https://picsum.photos/100"
alt="Avatar"
>

</div>

<div
class="name"
id="roomTitle"
>
ruang-tes-123
</div>

<div class="top-right">

<img
class="top-ico"
id="top3"
src="https://img.icons8.com/ios-filled/50/000000/video-call.png"
alt="Video"
>

<img
class="top-ico"
id="top4"
src="https://img.icons8.com/ios-filled/50/000000/phone.png"
alt="Telepon"
>

<img
class="top-ico"
id="top5"
src="https://img.icons8.com/ios-filled/50/000000/menu-2.png"
alt="Teman"
>

</div>

</div>


<!-- PEOPLE -->

<div id="peoplePanel">

<div class="people-title">
Teman di room
</div>

<div id="peopleList"></div>

</div>


<!-- CHAT -->

<div
class="chat-area"
id="msgs"
></div>


<!-- EMOJI -->

<div id="emojiPanel"></div>


<!-- CALL -->

<div id="callScreen">

<div id="remoteVideo">
Menunggu teman...
</div>

<div id="localVideo"></div>

<div class="call-controls">

<button
class="call-btn end-call"
id="endCallBtn"
>

<img
src="https://img.icons8.com/ios-filled/50/ffffff/phone.png"
alt="Akhiri"
>

</button>

</div>

</div>


<!-- INCOMING -->

<div id="incomingCall">

<div class="incoming-card">

<div class="incoming-avatar">

<img
src="https://picsum.photos/100"
alt="Avatar"
>

</div>

<div
class="incoming-name"
id="callerName"
>
Teman
</div>

<div
class="incoming-type"
id="callerType"
>
Panggilan masuk
</div>

<div class="incoming-buttons">

<button
class="incoming-btn reject"
id="rejectCall"
>

<img
src="https://img.icons8.com/ios-filled/50/ffffff/phone.png"
alt="Tolak"
>

</button>

<button
class="incoming-btn accept"
id="acceptCall"
>

<img
src="https://img.icons8.com/ios-filled/50/ffffff/phone.png"
alt="Angkat"
>

</button>

</div>

</div>

</div>


<!-- INPUT -->

<div class="input-bar">

<div class="input-box">

<img
class="ico"
id="icon1"
src="https://img.icons8.com/ios-filled/50/000000/happy.png"
alt="Emoji"
>

<input
id="txt"
placeholder="Ketik pesan"
autocomplete="off"
>

<img
class="ico"
id="icon2"
src="https://img.icons8.com/ios-filled/50/000000/attach.png"
alt="File"
>

<img
class="ico"
id="icon3"
src="https://img.icons8.com/ios-filled/50/000000/camera.png"
alt="Kamera"
>

</div>

<img
class="mic-foto"
id="btnKirim"
src="https://img.icons8.com/ios-filled/50/ffffff/microphone.png"
alt="Mic"
>

</div>


<!-- JOIN -->

<div id="joinModal">

<div class="join-card">

<h3>Masuk Room</h3>

<input
id="room"
value="ruang-tes-123"
placeholder="Nama room"
>

<input
id="myName"
placeholder="Nama kamu"
>

<button id="join">
Masuk
</button>

</div>

</div>


<script>

/* =====================================================
CONFIG
===================================================== */

const ICE_CONFIG = {

iceServers:[

{
urls:"stun:stun.l.google.com:19302"
},

{
urls:"stun:stun1.l.google.com:19302"
}

]

};


/* =====================================================
VARIABLES
===================================================== */

let socket = null;

let channelName = "";

let myName = "";

let myId = "";

let people = {};

let selectedPeer = null;

let pc = null;

let localStream = null;

let pendingCall = null;

let pendingCandidates = [];

let currentCallVideo = false;


/* =====================================================
WEBSOCKET URL
===================================================== */

function getWebSocketURL(){

return (
location.protocol === "https:"
? "wss://"
: "ws://"
) + location.host;

}


/* =====================================================
CHAT
===================================================== */

function addMsg(
text,
cls
){

const div =
document.createElement("div");

div.className =
"msg " + cls;

div.innerHTML =
text +
`<span class="time">${
new Date()
.toLocaleTimeString()
.slice(0,5)
}</span>`;

document
.getElementById("msgs")
.appendChild(div);

const box =
document.getElementById("msgs");

box.scrollTop =
box.scrollHeight;

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHtml(text){

return String(text)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* =====================================================
JOIN
===================================================== */

document
.getElementById("join")
.onclick = () => {

channelName =
document
.getElementById("room")
.value
.trim();

myName =
document
.getElementById("myName")
.value
.trim() ||
"Saya";

if(!channelName){

alert(
"Masukkan nama room."
);

return;

}


myId =
Math.random()
.toString(36)
.substring(2,10);


socket =
new WebSocket(
getWebSocketURL()
);


socket.onopen = () => {

socket.send(
JSON.stringify({

type:"join",

room:channelName,

id:myId,

name:myName

})
);


document
.getElementById("joinModal")
.style.display =
"none";


document
.getElementById("roomTitle")
.innerText =
channelName;


addMsg(
"Kamu bergabung ke " +
escapeHtml(channelName),
"me"
);

};


socket.onmessage =
async event => {

try{

const data =
JSON.parse(event.data);

await handleSignal(data);

}catch(error){

console.error(
error
);

}

};


socket.onerror = () => {

addMsg(
"WebSocket gagal terhubung.",
"you"
);

};


socket.onclose = () => {

addMsg(
"Server terputus.",
"you"
);

};

};


/* =====================================================
SIGNAL
===================================================== */

async function handleSignal(data){

/* PEOPLE */

if(data.type === "people"){

people = {};

(data.users || [])
.forEach(user => {

if(user.id !== myId){

people[user.id] =
user;

}

});

renderPeople();

return;

}


/* CHAT */

if(data.type === "chat"){

addMsg(

"<b>" +
escapeHtml(
data.name || "Teman"
) +
":</b> " +
escapeHtml(
data.msg
),

"you"

);

return;

}


/* INCOMING */

if(
data.type === "incoming-call"
){

pendingCall = data;

selectedPeer =
data.from;

currentCallVideo =
!!data.video;


document
.getElementById("callerName")
.innerText =
data.name ||
"Teman";


document
.getElementById("callerType")
.innerText =
data.video
? "Panggilan video masuk"
: "Panggilan suara masuk";


document
.getElementById("incomingCall")
.style.display =
"flex";


return;

}


/* OFFER */

if(data.type === "offer"){

if(
pendingCall &&
pendingCall.from === data.from
){

pendingCall.offer =
data.offer;

}

return;

}


/* ANSWER */

if(data.type === "answer"){

if(!pc){

return;

}

try{

await pc.setRemoteDescription(

new RTCSessionDescription(
data.answer
)

);

await flushCandidates();

}catch(error){

console.error(error);

}

return;

}


/* CANDIDATE */

if(data.type === "candidate"){

if(
pc &&
pc.remoteDescription
){

try{

await pc.addIceCandidate(

new RTCIceCandidate(
data.candidate
)

);

}catch(error){

console.error(error);

}

}else{

pendingCandidates.push(
data.candidate
);

}

return;

}


/* REJECT */

if(
data.type === "call-rejected"
){

alert(
"Panggilan ditolak."
);

await endCall(false);

return;

}


/* END */

if(
data.type === "call-ended"
){

await endCall(false);

return;

}

}


/* =====================================================
SEND SIGNAL
===================================================== */

function sendSignal(data){

if(
!socket ||
socket.readyState !==
WebSocket.OPEN
){

alert(
"Server belum terhubung."
);

return false;

}

socket.send(

JSON.stringify({

...data,

room:channelName,

from:myId

})

);

return true;

}


/* =====================================================
PEOPLE
===================================================== */

function renderPeople(){

const list =
document
.getElementById(
"peopleList"
);

list.innerHTML = "";


const ids =
Object.keys(people);


if(ids.length === 0){

list.innerHTML =
"<div style='padding:12px;color:#777'>" +
"Belum ada teman" +
"</div>";

return;

}


ids.forEach(id => {

const p =
people[id];


const div =
document.createElement("div");

div.className =
"person";


div.innerHTML = `

<img
src="https://picsum.photos/100?random=${encodeURIComponent(id)}"
>

<div class="person-name">
${escapeHtml(p.name)}
</div>

<div>
📞
</div>

`;


div.onclick = () => {

selectedPeer =
id;

document
.getElementById(
"peoplePanel"
)
.style.display =
"none";

alert(
"Teman dipilih: " +
p.name
);

};


list.appendChild(div);

});

}


/* =====================================================
MEDIA
===================================================== */

async function getMedia(video){

if(localStream){

return;

}


localStream =
await navigator
.mediaDevices
.getUserMedia({

audio:true,

video:
video
? {
facingMode:"user"
}
: false

});


if(video){

const box =
document
.getElementById(
"localVideo"
);

box.innerHTML = "";


const v =
document.createElement(
"video"
);

v.autoplay = true;

v.muted = true;

v.playsInline = true;

v.srcObject =
localStream;

box.appendChild(v);

}

}


/* =====================================================
PEER
===================================================== */

function createPeer(){

if(pc){

return pc;

}


pc =
new RTCPeerConnection(
ICE_CONFIG
);


if(localStream){

localStream
.getTracks()
.forEach(track => {

pc.addTrack(
track,
localStream
);

});

}


pc.onicecandidate =
event => {

if(event.candidate){

sendSignal({

type:"candidate",

to:selectedPeer,

candidate:
event.candidate

});

}

};


pc.ontrack =
event => {

const box =
document
.getElementById(
"remoteVideo"
);

let video =
box.querySelector(
"video"
);


if(!video){

box.innerHTML = "";

video =
document.createElement(
"video"
);

video.autoplay = true;

video.playsInline = true;

box.appendChild(video);

}


if(event.streams[0]){

video.srcObject =
event.streams[0];

}

};


pc.onconnectionstatechange =
() => {

if(!pc){

return;

}

console.log(
"Connection:",
pc.connectionState
);


if(
pc.connectionState ===
"connected"
){

addMsg(
"Panggilan tersambung.",
"me"
);

}


if(
pc.connectionState ===
"failed"
){

addMsg(
"Panggilan gagal tersambung.",
"you"
);

endCall(false);

}

};


return pc;

}


/* =====================================================
ICE
===================================================== */

async function flushCandidates(){

if(
!pc ||
!pc.remoteDescription
){

return;

}


while(
pendingCandidates.length
){

const candidate =
pendingCandidates.shift();


try{

await pc.addIceCandidate(

new RTCIceCandidate(
candidate
)

);

}catch(error){

console.error(
error
);

}

}

}


/* =====================================================
START CALL
===================================================== */

async function startCall(video){

if(!selectedPeer){

document
.getElementById(
"peoplePanel"
)
.style.display =
"block";

renderPeople();

alert(
"Pilih teman terlebih dahulu."
);

return;

}


if(pc){

alert(
"Panggilan sedang berlangsung."
);

return;

}


currentCallVideo =
video;


try{

await getMedia(
video
);

createPeer();


/*
Kirim notifikasi panggilan.
*/

sendSignal({

type:"incoming-call",

to:selectedPeer,

name:myName,

video:video

});


/*
Buat offer.
*/

const offer =
await pc.createOffer();


await pc.setLocalDescription(
offer
);


sendSignal({

type:"offer",

to:selectedPeer,

offer:offer,

video:video

});


showCall(video);


}catch(error){

console.error(
error
);

await endCall(false);

alert(
"Kamera atau mikrofon tidak dapat digunakan."
);

}

}


/* =====================================================
ANSWER
===================================================== */

async function answerCall(){

if(!pendingCall){

return;

}


const call =
pendingCall;


selectedPeer =
call.from;


try{

await getMedia(
!!call.video
);

createPeer();


let count = 0;

while(
!call.offer &&
count < 100
){

await new Promise(
resolve =>
setTimeout(
resolve,
100
)
);

count++;

}


if(!call.offer){

throw new Error(
"Offer tidak diterima."
);

}


await pc.setRemoteDescription(

new RTCSessionDescription(
call.offer
)

);


await flushCandidates();


const answer =
await pc.createAnswer();


await pc.setLocalDescription(
answer
);


sendSignal({

type:"answer",

to:call.from,

answer:answer

});


showCall(
!!call.video
);


pendingCall = null;


}catch(error){

console.error(
error
);

alert(
"Gagal menerima panggilan."
);

await endCall(false);

}

}


/* =====================================================
SHOW CALL
===================================================== */

function showCall(video){

document
.getElementById(
"callScreen"
)
.style.display =
"flex";


if(!video){

document
.getElementById(
"localVideo"
)
.innerHTML =
"";

}

}


/* =====================================================
ACCEPT
===================================================== */

document
.getElementById(
"acceptCall"
)
.onclick =
async () => {

document
.getElementById(
"incomingCall"
)
.style.display =
"none";

await answerCall();

};


/* =====================================================
REJECT
===================================================== */

document
.getElementById(
"rejectCall"
)
.onclick =
() => {

if(
pendingCall
){

sendSignal({

type:
"call-rejected",

to:
pendingCall.from

});

}


pendingCall = null;


document
.getElementById(
"incomingCall"
)
.style.display =
"none";

};


/* =====================================================
END CALL
===================================================== */

async function endCall(
sendEnd = true
){

const peer =
selectedPeer;


if(
sendEnd &&
peer
){

sendSignal({

type:
"call-ended",

to:
peer

});

}


if(localStream){

localStream
.getTracks()
.forEach(
track =>
track.stop()
);

localStream = null;

}


if(pc){

pc.close();

pc = null;

}


pendingCall = null;

pendingCandidates = [];


document
.getElementById(
"localVideo"
)
.innerHTML =
"";


document
.getElementById(
"remoteVideo"
)
.innerHTML =
"Menunggu teman...";


document
.getElementById(
"callScreen"
)
.style.display =
"none";

}


/* =====================================================
HEADER
===================================================== */

document
.getElementById("top1")
.onclick = () => {

location.reload();

};


document
.getElementById("top3")
.onclick = () => {

startCall(true);

};


document
.getElementById("top4")
.onclick = () => {

startCall(false);

};


document
.getElementById("top5")
.onclick = () => {

const panel =
document
.getElementById(
"peoplePanel"
);

panel.style.display =
panel.style.display ===
"block"
? "none"
: "block";

renderPeople();

};


/* END CALL */

document
.getElementById(

/* =====================================================
CHAT
===================================================== */

const txt =
document.getElementById(
"txt"
);

const btn =
document.getElementById(
"btnKirim"
);


function updateTombol(){

if(
txt.value.trim()
){

btn.src =
"https://img.icons8.com/ios-filled/50/ffffff/sent.png";

btn.dataset.mode =
"send";

}else{

btn.src =
"https://img.icons8.com/ios-filled/50/ffffff/microphone.png";

btn.dataset.mode =
"mic";

}

}


function send(){

const text =
txt.value.trim();


if(!text){

return;

}


addMsg(
"Kamu: " +
escapeHtml(text),
"me"
);


if(
socket &&
socket.readyState ===
WebSocket.OPEN
){

sendSignal({

type:"chat",

name:myName,

msg:text

});

}


txt.value = "";

updateTombol();

}


txt.addEventListener(
"input",
updateTombol
);


txt.addEventListener(
"keydown",
e => {

if(
e.key === "Enter"
){

e.preventDefault();

send();

}

});


btn.onclick = () => {

if(
btn.dataset.mode ===
"send"
){

send();

}else{

alert(
"Fitur rekam suara belum diaktifkan."
);

}

};

];


emojiPanel.innerHTML =
emojis
.map(
e =>
`<span>${e}</span>`
)
.join("");


document
.getElementById("icon1")
.onclick = () => {

emojiPanel.style.display =
emojiPanel.style.display ===
"block"
? "none"
: "block";

};


emojiPanel.onclick =
e => {

if(
e.target.tagName ===
"SPAN"
){

txt.value +=
e.target.innerText;

txt.focus();

updateTombol();

}

};

/* =====================================================
CAMERA
===================================================== */

document
.getElementById("icon3")
.onclick =
async () => {

let stream = null;


try{

stream =
await navigator
.mediaDevices
.getUserMedia({

video:true

});


const v =
document.createElement(
"video"
);

v.srcObject =
stream;

v.autoplay = true;

v.playsInline = true;

v.style.cssText =
"position:fixed;" +
"inset:0;" +
"width:100%;" +
"height:100%;" +
"z-index:60;" +
"object-fit:cover;" +
"background:#000;";


document
.body
.appendChild(v);


v.onclick = () => {

const canvas =
document.createElement(
"canvas"
);


canvas.width =
v.videoWidth;

canvas.height =
v.videoHeight;


canvas
.getContext("2d")
.drawImage(
v,
0,
0
);


const url =
canvas.toDataURL(
"image/jpeg",
0.8
);


addMsg(

`<img src="${url}"
style="max-width:220px;border-radius:8px">`,

"me"

);


stream
.getTracks()
.forEach(
t => t.stop()
);


v.remove();

};


}catch(error){

console.error(
error
);

if(stream){

stream
.getTracks()
.forEach(
t => t.stop()
);

}


alert(
"Kamera tidak diizinkan."
);

}

};


/* =====================================================
INIT
===================================================== */

updateTombol();

</script>
