<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chat & Call</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  color:#222;
}

button{cursor:pointer}

#roomScreen{
  position:fixed;
  inset:0;
  background:#0084ff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:5000;
}

.roomBox{
  width:100%;
  max-width:380px;
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 10px 40px rgba(0,0,0,.2);
}

.logo{
  width:80px;
  height:80px;
  margin:0 auto 15px;
  border-radius:50%;
  background:#0084ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.roomBox h2{
  text-align:center;
  margin:5px 0 8px;
}

.roomBox p{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:20px;
}

.roomBox input{
  width:100%;
  height:48px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:0 14px;
  margin-bottom:10px;
  font-size:16px;
  outline:none;
}

.joinButton,
.roomAction{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
}

.joinButton{background:#0084ff}
.roomAction{background:#22c55e}

.roomInfo{
  margin-top:8px;
  text-align:center;
  font-size:13px;
  color:#777;
}

#roomLinkBox{
  display:none;
  margin-top:10px;
  padding:12px;
  background:#f3f4f6;
  border-radius:12px;
  font-size:13px;
  word-break:break-all;
}

header{
  height:58px;
  background:#0084ff;
  color:white;
  display:flex;
  align-items:center;
  padding:0 12px;
  font-size:19px;
  font-weight:bold;
}

#status{
  margin-left:auto;
  font-size:12px;
  font-weight:normal;
}

.callButton{
  background:transparent;
  color:white;
  font-size:22px;
  border:none;
  margin-left:5px;
  padding:5px;
}

#chat{
  height:calc(100vh - 120px);
  overflow-y:auto;
  padding:12px;
}

.message{
  max-width:80%;
  padding:10px 13px;
  margin:7px 0;
  border-radius:15px;
  word-wrap:break-word;
}

.me{
  background:#0084ff;
  color:white;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.other{
  background:white;
  margin-right:auto;
  border-bottom-left-radius:4px;
}

.system{
  text-align:center;
  color:#777;
  font-size:13px;
  margin:10px;
}

#inputArea{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:62px;
  background:white;
  display:flex;
  align-items:center;
  padding:7px;
  gap:6px;
  border-top:1px solid #ddd;
}

#messageInput{
  flex:1;
  height:46px;
  border:1px solid #ddd;
  border-radius:23px;
  padding:0 15px;
  font-size:16px;
  outline:none;
}

.iconButton{
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#eee;
  font-size:21px;
}

.sendButton{
  background:#0084ff;
  color:white;
}

#fileInput{
  display:none;
}

.chatImage{
  max-width:220px;
  max-height:300px;
  border-radius:10px;
  display:block;
}

#videoScreen{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:1000;
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

#localVideo{
  position:absolute;
  right:12px;
  top:12px;
  width:120px;
  height:170px;
  object-fit:cover;
  background:#222;
  border-radius:10px;
  border:2px solid white;
}

.callControls{
  position:absolute;
  bottom:30px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:20px;
}

.callControl{
  width:58px;
  height:58px;
  border:none;
  border-radius:50%;
  font-size:25px;
  color:white;
  background:#333;
}

.endCall{
  background:#e53935;
}

#incomingCall{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.92);
  color:white;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.callerIcon{
  width:95px;
  height:95px;
  border-radius:50%;
  background:#0084ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  margin-bottom:20px;
}

#callerName{
  font-size:25px;
  margin-bottom:8px;
}

#callType{
  color:#ccc;
  margin-bottom:35px;
}

.incomingButtons{
  display:flex;
  gap:45px;
}

.incomingButton{
  width:65px;
  height:65px;
  border:none;
  border-radius:50%;
  color:white;
  font-size:28px;
}

.accept{
  background:#22c55e;
}

.reject{
  background:#ef4444;
}

#callStatus{
  position:absolute;
  left:0;
  right:0;
  top:15px;
  text-align:center;
  color:white;
  font-size:14px;
  z-index:2;
  text-shadow:0 1px 4px #000;
}
</style>
</head>

<body>

<!-- =========================
     ROOM SCREEN
========================= -->

<div id="roomScreen">

  <div class="roomBox">

    <div class="logo">💬</div>

    <h2>Chat & Call</h2>

    <p>
      Chat, telepon suara dan video call
      dengan teman.
    </p>

    <input
      id="nameInput"
      type="text"
      placeholder="Nama kamu"
      autocomplete="off">

    <input
      id="roomInput"
      type="text"
      placeholder="ID Room"
      autocomplete="off">

    <button
      class="roomAction"
      onclick="createRoom()">
      🎥 Buat Room
    </button>

    <button
      class="joinButton"
      onclick="joinRoom()">
      Masuk Room
    </button>

    <div id="roomLinkBox">

      <div id="roomLink"></div>

      <br>

      <button
        class="joinButton"
        onclick="shareRoom()">
        🔗 Bagikan Link Room
      </button>

    </div>

    <div class="roomInfo">
      Teman cukup membuka link yang kamu bagikan
      dan menggunakan Room yang sama.
    </div>

  </div>

</div>


<!-- =========================
     HEADER
========================= -->

<header>

  <span>Chat & Call</span>

  <button
    class="callButton"
    onclick="startCall(true)">
    📹
  </button>

  <button
    class="callButton"
    onclick="startCall(false)">
    📞
  </button>

  <span id="status">
    Menghubungkan...
  </span>

</header>


<!-- =========================
     CHAT
========================= -->

<div id="chat">

  <div class="system">
    Belum terhubung.
  </div>

</div>


<div id="inputArea">

  <button
    class="iconButton"
    onclick="document.getElementById('fileInput').click()">
    🖼️
  </button>

  <input
    id="fileInput"
    type="file"
    accept="image/*"
    onchange="sendImage(event)">

  <input
    id="messageInput"
    type="text"
    placeholder="Tulis pesan..."
    autocomplete="off">

  <button
    class="iconButton sendButton"
    onclick="sendMessage()">
    ➤
  </button>

</div>


<!-- =========================
     VIDEO
========================= -->

<div id="videoScreen">

  <div id="callStatus">
    Menghubungkan...
  </div>

  <video
    id="remoteVideo"
    autoplay
    playsinline>
  </video>

  <video
    id="localVideo"
    autoplay
    muted
    playsinline>
  </video>

  <div class="callControls">

    <button
      class="callControl"
      onclick="toggleMute()">
      🎤
    </button>

    <button
      class="callControl"
      onclick="toggleCamera()">
      📷
    </button>

    <button
      class="callControl endCall"
      onclick="endCall()">
      ☎
    </button>

  </div>

</div>


<!-- =========================
     INCOMING CALL
========================= -->

<div id="incomingCall">

  <div class="callerIcon">
    👤
  </div>

  <div id="callerName">
    Panggilan masuk
  </div>

  <div id="callType">
    Panggilan video masuk
  </div>

  <div class="incomingButtons">

    <button
      class="incomingButton reject"
      onclick="rejectCall()">
      ✕
    </button>

    <button
      class="incomingButton accept"
      onclick="acceptCall()">
      ✓
    </button>

  </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let socket = null;
let connected = false;
let joined = false;

let myName = "";
let myRoom = "";

let peerConnection = null;
let localStream = null;

let pendingOffer = null;
let pendingCallType = "video";
let pendingCandidates = [];

let isCaller = false;


/* =========================
   WEBRTC
========================= */

const rtcConfig = {

  iceServers: [

    {
      urls: "stun:stun.l.google.com:19302"
    },

    {
      urls: "stun:stun1.l.google.com:19302"
    },

    {
      urls: "stun:stun.cloudflare.com:3478"
    }

  ]

};


/* =========================
   SEND SOCKET
========================= */

function sendSocket(data){

  if(
    socket &&
    socket.readyState === WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify(data)
    );

    return true;
  }

  return false;
}


/* =========================
   CREATE ROOM
========================= */

function createRoom(){

  const room =
    Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();

  document.getElementById("roomInput")
    .value = room;

  document.getElementById("roomLinkBox")
    .style.display = "block";

  updateRoomLink(room);

}


/* =========================
   ROOM LINK
========================= */

function updateRoomLink(room){

  const link =
    location.origin +
    location.pathname +
    "?room=" +
    encodeURIComponent(room);

  document.getElementById("roomLink")
    .textContent = link;

}


function shareRoom(){

  const room =
    document.getElementById("roomInput")
      .value.trim();

  if(!room){

    alert(
      "Buat Room terlebih dahulu."
    );

    return;
  }

  updateRoomLink(room);

  const link =
    location.origin +
    location.pathname +
    "?room=" +
    encodeURIComponent(room);

  if(navigator.share){

    navigator.share({

      title:"Chat & Call",

      text:"Gabung ke room saya:",

      url:link

    }).catch(()=>{});

  }else{

    copyText(link);

  }

}


/* =========================
   COPY LINK
========================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    alert(
      "Link Room berhasil disalin."
    );

  }catch{

    prompt(
      "Salin link ini:",
      text
    );

  }

}


/* =========================
   LOAD ROOM LINK
========================= */

function loadRoomFromLink(){

  const params =
    new URLSearchParams(
      location.search
    );

  const room =
    params.get("room");

  if(room){

    document.getElementById("roomInput")
      .value = room;

    document.getElementById("roomLinkBox")
      .style.display = "block";

    updateRoomLink(room);

  }

}


/* =========================
   CONNECT SOCKET
========================= */

function connectSocket(){

  const protocol =
    location.protocol === "https:"
      ? "wss://"
      : "ws://";

  socket =
    new WebSocket(
      protocol + location.host
    );


  socket.onopen = function(){

    connected = true;

    document.getElementById("status")
      .textContent = "Online";

    addSystem(
      "Server terhubung."
    );

  };


  socket.onclose = function(){

    connected = false;

    document.getElementById("status")
      .textContent = "Offline";

    addSystem(
      "Koneksi server terputus."
    );

  };


  socket.onerror = function(){

    document.getElementById("status")
      .textContent = "Error";

  };


  socket.onmessage =
    handleSocketMessage;

}


/* =========================
   JOIN ROOM
========================= */

function joinRoom(){

  myName =
    document.getElementById("nameInput")
      .value.trim();

  myRoom =
    document.getElementById("roomInput")
      .value.trim();

  if(!myName){

    alert(
      "Masukkan nama kamu."
    );

    return;
  }

  if(!myRoom){

    alert(
      "Masukkan ID Room."
    );

    return;
  }

  if(!connected){

    alert(
      "Tunggu server terhubung."
    );

    return;
  }

  sendSocket({

    type:"join",

    name:myName,

    room:myRoom

  });

}


/* =========================
   SOCKET MESSAGE
========================= */

async function handleSocketMessage(event){

  let data;

  try{

    data =
      JSON.parse(
        event.data
      );

  }catch{

    return;

  }


  /* CONNECTED */

  if(data.type === "connected"){

    return;

  }


  /* JOINED */

  if(data.type === "joined"){

    joined = true;

    myRoom = data.room;

    document.getElementById("roomScreen")
      .style.display = "none";

    addSystem(
      "Kamu masuk ke room: " +
      data.room
    );

    if(data.users > 1){

      addSystem(
        "Teman sudah terhubung."
      );

    }else{

      addSystem(
        "Menunggu teman masuk..."
      );

    }

    return;

  }


  /* USER JOINED */

  if(data.type === "user-joined"){

    addSystem(
      (data.name || "Teman") +
      " masuk ke room."
    );

    return;

  }


  /* USER LEFT */

  if(data.type === "user-left"){

    addSystem(
      "Teman keluar dari room."
    );

    if(peerConnection){

      endCall(false);

    }

    return;

  }


  /* ERROR */

  if(data.type === "error"){

    alert(
      data.message
    );

    return;

  }


  /* CHAT */

  if(data.type === "chat"){

    addMessage(
      data.text,
      false
    );

    return;

  }


  /* IMAGE */

  if(data.type === "image"){

    addImage(
      data.data,
      false
    );

    return;

  }


  /* INCOMING CALL */

  if(data.type === "call"){

    pendingCallType =
      data.callType || "video";

    document.getElementById("callerName")
      .textContent =
        data.name || "Teman";

    document.getElementById("callType")
      .textContent =
        pendingCallType === "video"
          ? "Panggilan video masuk"
          : "Panggilan suara masuk";

    document.getElementById("incomingCall")
      .style.display = "flex";

    return;

  }


  /* OFFER */

  if(data.type === "offer"){

    pendingOffer = data.offer;

    /*
      Jangan langsung membuat PeerConnection.
      Tunggu pengguna menekan Terima.
    */

    if(
      !document.getElementById(
        "incomingCall"
      ).style.display
    ){

      document.getElementById(
        "incomingCall"
      ).style.display = "flex";

    }

    return;

  }


  /* ANSWER */

  if(data.type === "answer"){

    if(!peerConnection){

      return;

    }

    try{

      await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            data.answer
          )
        );

      await addPendingCandidates();

      setCallStatus(
        "Menghubungkan..."
      );

    }catch(error){

      console.error(
        "ANSWER:",
        error
      );

    }

    return;

  }


  /* ICE */

  if(data.type === "candidate"){

    try{

      const candidate =
        new RTCIceCandidate(
          data.candidate
        );

      if(
        peerConnection &&
        peerConnection.remoteDescription
      ){

        await peerConnection
          .addIceCandidate(
            candidate
          );

      }else{

        pendingCandidates.push(
          candidate
        );

      }

    }catch(error){

      console.error(
        "ICE:",
        error
      );

    }

    return;

  }


  /* REJECT */

  if(data.type === "reject"){

    addSystem(
      "Panggilan ditolak."
    );

    endCall(false);

    return;

  }


  /* HANGUP */

  if(data.type === "hangup"){

    addSystem(
      "Teman mengakhiri panggilan."
    );

    endCall(false);

    return;

  }

}


/* =========================
   CHAT
========================= */

function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if(!text){

    return;

  }

  if(
    !connected ||
    !joined
  ){

    alert(
      "Masuk ke room terlebih dahulu."
    );

    return;

  }

  sendSocket({

    type:"chat",

    text:text

  });

  addMessage(
    text,
    true
  );

  input.value = "";

}


document.getElementById(
  "messageInput"
).addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      sendMessage();

    }

  }
);


function addMessage(
  text,
  mine
){

  const chat =
    document.getElementById(
      "chat"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " +
    (mine ? "me" : "other");

  div.textContent =
    text;

  chat.appendChild(
    div
  );

  chat.scrollTop =
    chat.scrollHeight;

}


function addSystem(text){

  const chat =
    document.getElementById(
      "chat"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "system";

  div.textContent =
    text;

  chat.appendChild(
    div
  );

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   IMAGE
========================= */

function sendImage(event){

  const file =
    event.target.files[0];

  if(!file){

    return;

  }

  if(!joined){

    alert(
      "Masuk ke room terlebih dahulu."
    );

    event.target.value = "";

    return;

  }

  if(
    file.size >
    5 * 1024 * 1024
  ){

    alert(
      "Foto maksimal 5 MB."
    );

    event.target.value = "";

    return;

  }

  const reader =
    new FileReader();

  reader.onload =
    function(){

      const data =
        reader.result;

      sendSocket({

        type:"image",

        data:data

      });

      addImage(
        data,
        true
      );

    };

  reader.readAsDataURL(
    file
  );

  event.target.value = "";

}


function addImage(
  data,
  mine
){

  const chat =
    document.getElementById(
      "chat"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " +
    (mine ? "me" : "other");

  const img =
    document.createElement(
      "img"
    );

  img.src = data;

  img.className =
    "chatImage";

  div.appendChild(
    img
  );

  chat.appendChild(
    div
  );

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   MEDIA
========================= */

async function getMedia(
  video
){

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Browser tidak mendukung kamera/mikrofon."
      );

    }

    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: video
            ? {
                facingMode:"user"
              }
            : false,

          audio:true

        });


    document.getElementById(
      "localVideo"
    ).srcObject =
      localStream;

    return true;

  }catch(error){

    console.error(
      "MEDIA:",
      error
    );

    alert(
      "Kamera/mikrofon tidak dapat digunakan.\n\n" +
      error.message
    );

    return false;

  }

}


/* =========================
   START CALL
========================= */

async function startCall(
  video
){

  if(
    !connected ||
    !joined
  ){

    alert(
      "Masuk ke room terlebih dahulu."
    );

    return;

  }

  if(peerConnection){

    alert(
      "Panggilan sedang berlangsung."
    );

    return;

  }

  const ok =
    await getMedia(
      video
    );

  if(!ok){

    return;

  }

  isCaller = true;

  pendingCallType =
    video
      ? "video"
      : "audio";

  showVideoScreen(
    video
  );

  setCallStatus(
    "Memanggil teman..."
  );

  createPeer();

  try{

    const offer =
      await peerConnection
        .createOffer();

    await peerConnection
      .setLocalDescription(
        offer
      );

    sendSocket({

      type:"call",

      callType:
        pendingCallType,

      name:
        myName

    });

    sendSocket({

      type:"offer",

      offer:
        peerConnection.localDescription

    });

  }catch(error){

    console.error(
      "OFFER:",
      error
    );

    alert(
      "Gagal membuat panggilan."
    );

    endCall(false);

  }

}


/* =========================
   CREATE PEER
========================= */

function createPeer(){

  if(peerConnection){

    return peerConnection;

  }

  peerConnection =
    new RTCPeerConnection(
      rtcConfig
    );


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        function(track){

          peerConnection.addTrack(
            track,
            localStream
          );

        }
      );

  }


  peerConnection.ontrack =
    function(event){

      if(
        event.streams &&
        event.streams[0]
      ){

        document.getElementById(
          "remoteVideo"
        ).srcObject =
          event.streams[0];

        setCallStatus(
          "📹 Panggilan tersambung"
        );

      }

    };


  peerConnection.onicecandidate =
    function(event){

      if(
        event.candidate &&
        connected
      ){

        sendSocket({

          type:"candidate",

          candidate:
            event.candidate

        });

      }

    };


  peerConnection.onconnectionstatechange =
    function(){

      if(!peerConnection){

        return;

      }

      const state =
        peerConnection
          .connectionState;

      console.log(
        "WebRTC:",
        state
      );

      if(
        state === "connected"
      ){

        setCallStatus(
          "📹 Panggilan tersambung"
        );

        addSystem(
          "📹 Panggilan tersambung."
        );

      }

      if(
        state === "connecting"
      ){

        setCallStatus(
          "Menghubungkan..."
        );

      }

      if(
        state === "disconnected"
      ){

        setCallStatus(
          "Koneksi terputus..."
        );

      }

      if(
        state === "failed"
      ){

        setCallStatus(
          "Koneksi gagal."
        );

        addSystem(
          "Koneksi video gagal."
        );

      }

    };


  peerConnection.oniceconnectionstatechange =
    function(){

      console.log(
        "ICE:",
        peerConnection
          .iceConnectionState
      );

    };


  return peerConnection;

}


/* =========================
   ACCEPT CALL
========================= */

async function acceptCall(){

  document.getElementById(
    "incomingCall"
  ).style.display =
    "none";


  const video =
    pendingCallType === "video";


  const ok =
    await getMedia(
      video
    );

  if(!ok){

    rejectCall();

    return;

  }


  isCaller = false;

  showVideoScreen(
    video
  );

  setCallStatus(
    "Menerima panggilan..."
  );


  createPeer();


  if(!pendingOffer){

    addSystem(
      "Menunggu data panggilan..."
    );

    return;

  }


  try{

    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          pendingOffer
        )
      );


    await addPendingCandidates();


    const answer =
      await peerConnection
        .createAnswer();


    await peerConnection
      .setLocalDescription(
        answer
      );


    sendSocket({

      type:"answer",

      answer:
        peerConnection.localDescription

    });


    pendingOffer = null;

    setCallStatus(
      "Menghubungkan..."
    );

  }catch(error){

    console.error(
      "ACCEPT:",
      error
    );

    alert(
      "Gagal menerima panggilan."
    );

    endCall(false);

  }

}


/* =========================
   PENDING ICE
========================= */

async function addPendingCandidates(){

  if(!peerConnection){

    return;

  }

  const list =
    pendingCandidates;

  pendingCandidates = [];


  for(
    const candidate of list
  ){

    try{

      await peerConnection
        .addIceCandidate(
          candidate
        );

    }catch(error){

      console.error(
        "ICE pending:",
        error
      );

    }

  }

}


/* =========================
   REJECT
========================= */

function rejectCall(){

  document.getElementById(
    "incomingCall"
  ).style.display =
    "none";

  if(connected){

    sendSocket({

      type:"reject"

    });

  }

  pendingOffer = null;

  pendingCandidates = [];

}


/* =========================
   END CALL
========================= */

function endCall(
  sendSignal = true
){

  if(
    sendSignal &&
    connected
  ){

    sendSocket({

      type:"hangup"

    });

  }


  if(peerConnection){

    peerConnection.ontrack = null;

    peerConnection.onicecandidate = null;

    peerConnection.close();

    peerConnection = null;

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

    localStream = null;

  }


  document.getElementById(
    "localVideo"
  ).srcObject = null;

  document.getElementById(
    "remoteVideo"
  ).srcObject = null;

  document.getElementById(
    "videoScreen"
  ).style.display =
    "none";

  document.getElementById(
    "incomingCall"
  ).style.display =
    "none";


  pendingOffer = null;

  pendingCandidates = [];

  isCaller = false;

  addSystem(
    "Panggilan selesai."
  );

}


/* =========================
   VIDEO SCREEN
========================= */

function showVideoScreen(
  video
){

  document.getElementById(
    "videoScreen"
  ).style.display =
    "block";

  document.getElementById(
    "localVideo"
  ).style.display =
    video
      ? "block"
      : "none";

}


/* =========================
   CALL STATUS
========================= */

function setCallStatus(
  text
){

  document.getElementById(
    "callStatus"
  ).textContent =
    text;

}


/* =========================
   MUTE
========================= */

function toggleMute(){

  if(!localStream){

    return;

  }

  localStream
    .getAudioTracks()
    .forEach(
      function(track){

        track.enabled =
          !track.enabled;

      }
    );

}


/* =========================
   CAMERA
========================= */

function toggleCamera(){

  if(!localStream){

    return;

  }

  localStream
    .getVideoTracks()
    .forEach(
      function(track){

        track.enabled =
          !track.enabled;

      }
    );

}


/* =========================
   START
========================= */

loadRoomFromLink();

connectSocket();

</script>
