<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Chat & Video Call</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:22px;
  padding:28px 22px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.logo{
  width:80px;
  height:80px;
  border-radius:22px;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#2563eb;
  color:white;
  font-size:38px;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:25px;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:25px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:16px;
  outline:none;
  margin-bottom:15px;
}

input:focus{
  border-color:#2563eb;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

#createRoomBtn{
  background:#2563eb;
  color:white;
}

#createRoomBtn:active{
  transform:scale(.98);
}

.roomBox{
  display:none;
  margin-top:22px;
  padding:16px;
  background:#f8fafc;
  border-radius:15px;
  border:1px solid #e2e8f0;
}

.roomTitle{
  font-weight:bold;
  margin-bottom:10px;
}

.roomLink{
  word-break:break-all;
  background:white;
  padding:12px;
  border-radius:10px;
  border:1px solid #cbd5e1;
  font-size:14px;
  color:#2563eb;
  margin-bottom:12px;
}

#shareRoomBtn{
  background:#16a34a;
  color:white;
}

#copyRoomBtn{
  background:#e2e8f0;
  color:#0f172a;
}

#joinBtn{
  background:#0f172a;
  color:white;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:22px 0;
  color:#94a3b8;
  font-size:14px;
}

.divider::before,
.divider::after{
  content:"";
  height:1px;
  background:#e2e8f0;
  flex:1;
}

.joinBox{
  display:none;
}

.info{
  text-align:center;
  margin-top:15px;
  color:#64748b;
  font-size:13px;
}

.status{
  text-align:center;
  margin-top:15px;
  color:#2563eb;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">🎥</div>

  <h1>Chat & Video Call</h1>

  <div class="subtitle">
    Buat room dan bagikan link ke teman
  </div>

  <!-- NAMA -->
  <label for="nameInput">Nama kamu</label>

  <input
    id="nameInput"
    type="text"
    placeholder="Masukkan nama kamu"
    autocomplete="name"
  >

  <!-- BUAT ROOM -->
  <button id="createRoomBtn">
    🎥 Buat Room
  </button>

  <!-- HASIL ROOM -->
  <div class="roomBox" id="roomBox">

    <div class="roomTitle">
      ✅ Room berhasil dibuat
    </div>

    <div class="roomLink" id="roomLink"></div>

    <button id="copyRoomBtn">
      📋 Salin Link
    </button>

    <button id="shareRoomBtn">
      🔗 Bagikan Link Room
    </button>

  </div>

  <div class="divider">
    atau
  </div>

  <!-- JOIN ROOM -->
  <div class="joinBox" id="joinBox">

    <label for="roomInput">
      ID Room
    </label>

    <input
      id="roomInput"
      type="text"
      placeholder="Masukkan ID Room"
    >

    <button id="joinBtn">
      🚀 Masuk Room
    </button>

  </div>

  <div class="status" id="status"></div>

  <div class="info">
    Bagikan link room kepada teman agar mereka dapat bergabung.
  </div>

</div>


<script>

/* =========================
   ELEMENT
========================= */

const nameInput =
  document.getElementById("nameInput");

const createRoomBtn =
  document.getElementById("createRoomBtn");

const roomBox =
  document.getElementById("roomBox");

const roomLink =
  document.getElementById("roomLink");

const copyRoomBtn =
  document.getElementById("copyRoomBtn");

const shareRoomBtn =
  document.getElementById("shareRoomBtn");

const roomInput =
  document.getElementById("roomInput");

const joinBtn =
  document.getElementById("joinBtn");

const joinBox =
  document.getElementById("joinBox");

const status =
  document.getElementById("status");


/* =========================
   BUAT ID ROOM
========================= */

function generateRoomId(){

  const chars =
    "abcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for(let i = 0; i < 8; i++){

    result +=
      chars.charAt(
        Math.floor(
          Math.random() * chars.length
        )
      );

  }

  return result;

}


/* =========================
   URL ROOM
========================= */

function makeRoomLink(roomId){

  return (
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(roomId)
  );

}


/* =========================
   BUAT ROOM
========================= */

createRoomBtn.addEventListener(
  "click",
  function(){

    const name =
      nameInput.value.trim();

    if(!name){

      alert(
        "Masukkan nama kamu terlebih dahulu."
      );

      nameInput.focus();

      return;
    }


    const roomId =
      generateRoomId();

    const link =
      makeRoomLink(roomId);


    /* Simpan data */

    localStorage.setItem(
      "chat_name",
      name
    );

    localStorage.setItem(
      "chat_room",
      roomId
    );


    /* Tampilkan */

    roomLink.textContent =
      link;

    roomBox.style.display =
      "block";

    joinBox.style.display =
      "none";

    status.textContent =
      "Room siap dibagikan.";

  }
);


/* =========================
   SALIN LINK
========================= */

copyRoomBtn.addEventListener(
  "click",
  async function(){

    const link =
      roomLink.textContent;

    try{

      await navigator.clipboard.writeText(
        link
      );

      copyRoomBtn.textContent =
        "✅ Link Disalin";

      setTimeout(
        function(){

          copyRoomBtn.textContent =
            "📋 Salin Link";

        },
        2000
      );

    }catch(error){

      alert(
        "Tidak bisa menyalin otomatis. Silakan tekan lama link untuk menyalinnya."
      );

    }

  }
);


/* =========================
   BAGIKAN LINK
========================= */

shareRoomBtn.addEventListener(
  "click",
  async function(){

    const link =
      roomLink.textContent;

    const name =
      nameInput.value.trim();

    const shareText =
      "Ayo bergabung ke room Chat & Video Call saya:\n\n" +
      link;


    /* Android / Chrome Share */

    if(
      navigator.share
    ){

      try{

        await navigator.share({

          title:
            "Chat & Video Call",

          text:
            shareText,

          url:
            link

        });

      }catch(error){

        /* User membatalkan share */

      }

    }else{

      try{

        await navigator.clipboard.writeText(
          link
        );

        alert(
          "Link room sudah disalin. Sekarang kirim ke teman."
        );

      }catch(error){

        alert(
          link
        );

      }

    }

  }
);


/* =========================
   JOIN ROOM
========================= */

joinBtn.addEventListener(
  "click",
  function(){

    const name =
      nameInput.value.trim();

    const roomId =
      roomInput.value.trim();


    if(!name){

      alert(
        "Masukkan nama kamu."
      );

      nameInput.focus();

      return;

    }


    if(!roomId){

      alert(
        "Masukkan ID Room."
      );

      roomInput.focus();

      return;

    }


    localStorage.setItem(
      "chat_name",
      name
    );

    localStorage.setItem(
      "chat_room",
      roomId
    );


    /*
      Masuk ke room.

      Jika server kamu menggunakan
      halaman room tersendiri,
      bagian ini bisa diarahkan
      ke halaman tersebut.
    */

    window.location.href =
      makeRoomLink(roomId);

  }
);


/* =========================
   CEK LINK ROOM
========================= */

function checkRoomFromUrl(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const room =
    params.get("room");


  if(room){

    roomInput.value =
      room;

    joinBox.style.display =
      "block";

    roomBox.style.display =
      "none";

    status.textContent =
      "Kamu mendapat undangan untuk bergabung ke room.";

  }

}


/* =========================
   LOAD NAMA
========================= */

const savedName =
  localStorage.getItem(
    "chat_name"
  );

if(savedName){

  nameInput.value =
    savedName;

}


/* =========================
   START
========================= */

checkRoomFromUrl();

</script>

</body>
  </html>
